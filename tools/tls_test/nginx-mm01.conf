# Sample nginx server block for MM-01 devices (TLS 1.2, VERIFY_NONE on the device).
# Requirements on the device side: ECDSA P-256 certificate, ECDHE-ECDSA-AES128-GCM-SHA256,
# group prime256v1, max_fragment_length honoured (OpenSSL 1.1.1+ - check `nginx -V`).
# Replace the host name, certificate paths and upstream with the real ones.

server {
    listen 443 ssl;
    server_name iot.b-zone.in;

    ssl_certificate      /etc/ssl/mm01/fullchain.pem;   # ECDSA P-256 leaf (+ intermediate if any)
    ssl_certificate_key  /etc/ssl/mm01/leaf.key;        # chmod 600

    ssl_protocols        TLSv1.2 TLSv1.3;               # device uses 1.2
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_ecdh_curve       prime256v1;

    # Session resumption: later polls skip the ~0.6 s ECC handshake on the device.
    ssl_session_cache    shared:MM01:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  on;

    ssl_buffer_size      4k;
    client_max_body_size 16k;

    location / {
        proxy_pass         http://frappe-bench-frappe;  # same upstream as the existing site
        proxy_set_header   Host dor-uat.b-zone.in;      # Frappe selects the site by Host
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
